<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MFC Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12100D;
    --paper: #F3E9D6;
    --paper-raised: #FBF5E8;
    --line: #DCCFB0;
    --terracotta: #A8461D;
    --terracotta-bg: #F1DCCB;
    --indigo: #1F3D5C;
    --indigo-bg: #DCE3E9;
    --gold-bg: #F1E7C6;
    --gold-fg: #7A5C10;
    --green: #3F7D52;
    --green-bg: #DCEADF;
    --red: #B23A2E;
    --muted: #6B6355;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  #app { padding: 28px 24px 60px; max-width: 1100px; margin: 0 auto; }
  h1, h2 { font-family: 'Space Grotesk', sans-serif; margin: 0; }
  button {
    font-family: inherit;
    cursor: pointer;
  }
  input, select {
    font-family: inherit;
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-size: 13.5px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 20px;
  }
  .subtitle { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); }
  .btn {
    padding: 9px 14px;
    border-radius: 6px;
    border: none;
    font-size: 13.5px;
    font-weight: 500;
  }
  .btn-primary { background: var(--terracotta); color: #FBEFE7; }
  .btn-outline { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn-outline-danger { background: transparent; border: 1px solid var(--line); color: var(--red); }
  .banner { font-size: 12.5px; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
  .banner-gold { background: var(--gold-bg); color: #5C4508; }
  .banner-green { background: var(--green-bg); color: var(--green); }

  .match-time { font-size: 13px; font-weight: 600; width: 48px; }
  .badge {

  .badge-U23 { background: var(--indigo-bg); color: var(--indigo); }
  .badge-NEXT { background: var(--gold-bg); color: var(--gold-fg); }
  .badge-Diaspora { background: var(--green-bg); color: var(--green); }
  .day-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }

  .avatar {

  .player-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-club { font-size: 12px; color: var(--muted); }
  .empty-row { font-size: 13px; color: var(--muted); padding: 8px 0; }
  #overlay {

  #panel {

  .detail-row span:last-child { font-weight: 500; }
  .field { margin-bottom: 12px; }

  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .cat-toggle {
    padding: 5px 11px; border-radius: 14px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); font-size: 12px; margin-right: 6px; margin-bottom: 6px;
  }

  .form-error { font-size: 12.5px; color: var(--red); margin-bottom: 10px; }
  .form-actions { display: flex; gap: 8px; margin-top: 8px; }
  .form-actions .btn { flex: 1; }
</style>
</head>

function todayISO() { return new Date().toISOString().slice(0,10); }
function addDays(n) { const d = new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function formatDateLabel(iso) {
  const d = new Date(iso + "T00:00:00");
  const jours = ["dim","lun","mar","mer","jeu","ven","sam"];
  const mois = ["jan","fev","mar","avr","mai","juin","juil","aout","sep","oct","nov","dec"];
  return `${jours[d.getDay()]} ${d.getDate()} ${mois[d.getMonth()]}`;
}
function ageFromISO(iso) {
  const b = new Date(iso);
  return Math.floor((Date.now() - b.getTime()) / (365.25*24*3600*1000));
}
function initials(prenom, nom) {
  return `${(prenom||"?")[0]||""}${(nom||"?")[0]||""}`.toUpperCase();
}
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function sportsDbSearchTeam(teamName) {
  const res = await fetch(`${THESPORTSDB_BASE}/searchteams.php?t=${encodeURIComponent(teamName)}`);
  if (!res.ok) throw new Error("network");
  const data = await res.json();
  if (!data.teams || data.teams.length === 0) return null;
  return data.teams[0];
}
async function sportsDbNextEvents(teamId) {
  const res = await fetch(`${THESPORTSDB_BASE}/eventsnext.php?id=${teamId}`);
  if (!res.ok) throw new Error("network");
  const data = await res.json();
  return data.events || [];
}

  const res = await fetch(`${THESPORTSDB_BASE}/search_all_teams.php?l=English%20Premier%20League`);
  if (!res.ok) throw new Error("network");
  const data = await res.json();

}

async function apiFootballCall(endpoint, params) {
  const qs = new URLSearchParams({ endpoint, ...params }).toString();
  const res = await fetch(`/.netlify/functions/football?${qs}`);
  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    throw new Error(errBody.error || `Erreur du relais (statut ${res.status}).`);
  }
  return res.json();
}

async function apiFootballSearchTeam(teamName) {
  const data = await apiFootballCall("teams", { search: teamName });
  if (data.errors && Object.keys(data.errors).length) {
    throw new Error(typeof data.errors === "string" ? data.errors : JSON.stringify(data.errors));
  }
  if (!data.response || data.response.length === 0) return null;
  return data.response[0].team; // { id, name, country, logo, ... }
}

async function apiFootballNextFixtures(teamId, count) {
  const data = await apiFootballCall("fixtures", { team: teamId, next: count || 5 });
  if (data.errors && Object.keys(data.errors).length) {

  }
  return data.response || [];
}

};

function getISOWeekNumber(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function getEditorialFormat(date) {
  date = date || new Date();
  return EDITORIAL_FORMATS[date.getDay()];
}

function getCurrentPortrait(date) {
  const week = getISOWeekNumber(date || new Date());
  const idx = (week - 1) % PORTRAIT_SCHEDULE.length;
  return PORTRAIT_SCHEDULE[idx];
}

async function callClaude(prompt, tools, timeoutMs) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), timeoutMs || 30000);
  let res;
  const body = {
    model: CLAUDE_MODEL,
    max_tokens: 1500,
    messages: [{ role: "user", content: prompt }]
  };
  if (tools) body.tools = tools;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": state.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify(body),
      signal: controller.signal
    });
  } catch (networkErr) {
    if (networkErr.name === "AbortError") {
      throw new Error(`Délai dépassé (${Math.round((timeoutMs || 30000)/1000)}s) — la requête n'a pas abouti. Vérifie ta connexion ou réessaie.`);
    }
    throw new Error("Échec réseau : " + (networkErr.message || "impossible de contacter l'API Anthropic (souvent un blocage CORS ou réseau)."));
  } finally {
    clearTimeout(timeoutId);
  }
  let bodyJson;
  try {
    bodyJson = await res.json();
  } catch (parseErr) {
    throw new Error(`Réponse illisible de l'API (statut ${res.status}).`);
  }
  if (!res.ok) {
    throw new Error(bodyJson?.error?.message || `Erreur API (statut ${res.status}).`);
  }
  if (!bodyJson.content || !Array.isArray(bodyJson.content)) {
    throw new Error("Réponse inattendue de l'API : pas de contenu retourné.");
  }
  return bodyJson.content.map(b => b.text || "").join("\n").trim();
}

function buildDashboardSummary() {
  const today = todayISO();
  const active = state.players.filter(p => p.actif);
  const todays = state.matches.filter(m => m.date === today);
  const upcoming = state.matches
    .filter(m => m.date > today)
    .sort((a,b) => a.date.localeCompare(b.date))
    .slice(0, 10);

  const lines = [];

  lines.push("Actualités Mali / FEMAFOOT récentes :");
  if (state.newsState && state.newsState.text) {
    lines.push(state.newsState.text);
    lines.push(`(vérifiées le ${state.newsState.fetchedAt ? new Date(state.newsState.fetchedAt).toLocaleString("fr-FR") : "date inconnue"})`);
  } else {
    lines.push("- Aucune actualité récupérée pour le moment (clique sur \"Actualiser\" dans le bloc actualités avant de générer un post qui en dépend).");
  }
  lines.push("");

  lines.push("Joueurs suivis :");
  active.forEach(p => {
    lines.push(`- ${p.prenom} ${p.nom} (${p.club}, ${p.paysClub}) · catégories: ${p.categories.join(", ")} · priorité ${p.priorite} · statut Mali: ${p.statutMali}`);
  });
  lines.push("");
  lines.push("Matchs aujourd'hui :");
  if (todays.length === 0) lines.push("- Aucun");
  todays.forEach(m => {
    const p = playerById(m.playerId);
    lines.push(`- ${p ? p.prenom + " " + p.nom : "?"} · ${m.heure} · ${p ? p.club : "?"} vs ${m.adversaire} · ${m.competition} · statut: ${m.statut} · source: ${m.source || "Manuel"}`);
  });
  lines.push("");
  lines.push("Prochains matchs :");
  if (upcoming.length === 0) lines.push("- Aucun");
  upcoming.forEach(m => {
    const p = playerById(m.playerId);
    lines.push(`- ${formatDateLabel(m.date)} ${m.heure} · ${p ? p.prenom + " " + p.nom : "?"} · ${p ? p.club : "?"} vs ${m.adversaire} · ${m.competition} · source: ${m.source || "Manuel"}`);
  });
  lines.push("");
  lines.push("Statistiques joueurs récupérées (Highlightly) :");
  const statsEntries = Object.entries(state.playerStats).filter(([, s]) => s && s.raw);
  if (statsEntries.length === 0) {
    lines.push("- Aucune statistique récupérée pour le moment (clique sur \"Voir les statistiques\" sur une fiche joueur avant de générer un post de type MFC Data).");
  } else {
    statsEntries.forEach(([playerId, s]) => {
      const p = playerById(playerId);
      const name = p ? `${p.prenom} ${p.nom}` : (s.playerName || "Joueur inconnu");
      const competitions = s.raw.perCompetition || (Array.isArray(s.raw) ? s.raw : [s.raw]);
      competitions.forEach(c => {
        const parts = [];
        if (c.club) parts.push(`club: ${c.club}`);
        if (c.league) parts.push(`compétition: ${c.league}`);
        if (c.season) parts.push(`saison: ${c.season}`);
        if (c.gamesPlayed !== undefined) parts.push(`matchs joués: ${c.gamesPlayed}`);
        if (c.goals !== undefined) parts.push(`buts: ${c.goals}`);
        if (c.assists !== undefined) parts.push(`passes décisives: ${c.assists}`);
        if (c.minutesPlayed !== undefined) parts.push(`minutes jouées: ${c.minutesPlayed}`);
        if (c.yellowCards !== undefined) parts.push(`cartons jaunes: ${c.yellowCards}`);
        if (c.redCards !== undefined) parts.push(`cartons rouges: ${c.redCards}`);
        lines.push(`- ${name} · ${parts.join(", ")}`);
      });
    });
  }

  return lines.join("\n");
}

async function generatePosts() {
  if (!state.apiKey) {
    state.panel = { type: "settings" };
    render();
    return;
  }
  state.postsGen = { loading: true };
  state.panel = { type: "posts" };
  render();

  const summary = buildDashboardSummary();
  const format = getEditorialFormat();
  let formatInstructions = `Format du jour : "${format.name}" (publication prévue ${format.time}).\nObjectif de ce format : ${format.objective}`;

async function fetchFederationNews(force) {
  if (state.newsState && state.newsState.loading) return;
  if (!force) {
    const cached = loadNewsCache();
    if (cached && Date.now() - cached.fetchedAt < NEWS_MAX_AGE_MS) {
      state.newsState = { loading: false, text: cached.text, fetchedAt: cached.fetchedAt };
      render();
      return;
    }
  }
  if (!state.apiKey) {
    state.newsState = { needsKey: true };
    render();
    return;
  }
  state.newsState = { loading: true };
  render();

  const prompt = `Tu surveilles l'actualité de l'équipe nationale de football du Mali (les Aigles) et de sa fédération (FEMAFOOT).

Cherche les informations les plus récentes possibles (idéalement des derniers jours) concernant :
- Les convocations en sélection nationale (toutes catégories : A, U23, U20, U17)

Réponds avec une liste à puces courte (5 éléments maximum), chaque élément précisant la date si disponible. N'invente aucune information : si tu ne trouves rien de récent sur un sujet précis, dis-le simplement plutôt que de deviner. Réponds en français, de façon concise, sans préambule ni conclusion.`;

  try {
    const text = await callClaude(prompt, [{ type: "web_search_20250305", name: "web_search" }], 60000);
    const fetchedAt = Date.now();
    state.newsState = { loading: false, text, fetchedAt };
    try {
      localStorage.setItem(NEWS_CACHE_KEY, JSON.stringify({ text, fetchedAt }));
    } catch (e) { /* stockage plein ou indisponible, on continue sans cache */ }
  } catch (e) {
    state.newsState = { loading: false, error: e.message || "Erreur inconnue" };
  }
  render();

function checkNewsOnLoad() {
  const cached = loadNewsCache();
  if (cached) {
    state.newsState = { loading: false, text: cached.text, fetchedAt: cached.fetchedAt };
  }
  if (!cached || Date.now() - cached.fetchedAt >= NEWS_MAX_AGE_MS) {
    if (state.apiKey) fetchFederationNews(false);
    else if (!cached) state.newsState = { needsKey: true };
  }
}

  render();
}

function computeScoreFromEntry(e) {
  const games = e.gamesPlayed || 0;
  const minutes = e.minutesPlayed || 0;
  const avgMinutes = games > 0 ? minutes / games : 0;
  const minutesScore = Math.min(avgMinutes / 90, 1) * 10;
  const goals = e.goals || 0;
  const assists = e.assists || 0;
  return minutesScore + goals * 4 + assists * 2;
}

function bestEntryForPlayer(raw) {
  const entries = raw.perCompetition || (Array.isArray(raw) ? raw : [raw]);
  let best = null;
  entries.forEach(e => {
    const s = computeScoreFromEntry(e);
    if (!best || s > best.score) best = { entry: e, score: s };
  });
  return best;
}

async function computeTop5() {
  const players = state.players.filter(p => p.actif);
  state.top5 = { loading: true, progress: 0, total: players.length };
  render();

  const results = [];
  let notFoundCount = 0;
  let networkErrorCount = 0;
  let lastNetworkError = null;

  for (let i = 0; i < players.length; i++) {
    const p = players[i];
    state.top5.progress = i + 1;
    render();

    let cached = state.playerStats[p.id];
    let raw = cached && cached.raw && cached.fetchedAt && (Date.now() - cached.fetchedAt < STATS_MAX_AGE_MS) ? cached.raw : null;
    if (!raw) {
      try {
        const found = await highlightlySearchPlayer(`${p.prenom} ${p.nom}`);
        if (found) {
          const foundId = found.id || found.playerId;
          const stats = await highlightlyPlayerStatistics(foundId);
          state.playerStats[p.id] = { loading: false, playerName: found.name, raw: stats, fetchedAt: Date.now() };
          raw = stats;
        } else {
          state.playerStats[p.id] = { loading: false, error: "not_found" };
          notFoundCount++;
        }
      } catch (e) {
        state.playerStats[p.id] = { loading: false, error: "network", detail: e.message };
        networkErrorCount++;
        lastNetworkError = e.message;
      }
      await new Promise(r => setTimeout(r, 250));
    }

    if (raw) {
      const best = bestEntryForPlayer(raw);
      if (best && best.score > 0) {
        results.push({ player: p, entry: best.entry, score: best.score });
      }
    }
  }

  saveData();
  results.sort((a, b) => b.score - a.score);
  state.top5 = {
    loading: false,
    results: results.slice(0, 5),
    scannedCount: players.length,
    foundCount: results.length,
    notFoundCount,
    networkErrorCount,
    lastNetworkError
  };
  render();
}

function nextMatchFor(playerId) {
  const today = todayISO();
  return state.matches
    .filter(m => m.playerId === playerId && m.date >= today)
    .sort((a,b) => a.date.localeCompare(b.date))[0];
}
function filteredPlayers() {
  return state.players.filter(p => {
    if (!p.actif) return false;
    const q = state.query.trim().toLowerCase();
    const matchesQuery = q === "" || `${p.prenom} ${p.nom}`.toLowerCase().includes(q) || p.club.toLowerCase().includes(q);
    if (!matchesQuery) return false;
    if (state.filter === "Tous") return true;
    if (state.filter === "P1") return p.priorite === "P1";
    return p.categories.includes(state.filter);
  });
}
function todayMatches() {
  const today = todayISO();
  return state.matches.filter(m => m.date === today).sort((a,b) => a.heure.localeCompare(b.heure));
}
function upcomingByDay() {
  const today = todayISO();
  const future = state.matches.filter(m => m.date > today);
  const grouped = {};
  future.forEach(m => { (grouped[m.date] = grouped[m.date] || []).push(m); });
  return Object.entries(grouped).sort(([a],[b]) => a.localeCompare(b)).slice(0,5);
}
function playerById(id) { return state.players.find(p => p.id === id); }

function parseBulkImportLine(line) {
  const parts = line.split(";").map(s => s.trim());
  if (parts.length < 2 || !parts[0]) return null;
  const [nom_prenom, catsRaw, prioRaw, club, remarque] = parts;
  const cats = (catsRaw || "").split(",").map(s => s.trim()).filter(c => CATEGORY_STYLE[c]);
  return {
    prenom: nom_prenom.split(" ").slice(0, -1).join(" ") || nom_prenom,
    nom: nom_prenom.split(" ").slice(-1).join(" "),
    naissance: "",
    nationalite: "Mali",
    poste: (remarque && ["Gardien","Défenseur","Milieu","Attaquant"].includes(remarque)) ? remarque : "",
    pied: "Droit",
    club: club || "À compléter",
    paysClub: "",
    categories: cats.length ? cats : ["NEXT"],
    priorite: ["P1","P2","P3"].includes(prioRaw) ? prioRaw : "P3",
    statutMali: cats.includes("A") ? "International" : "Éligible",
    actif: true,
    remarque: remarque || ""
  };
}

      <textarea id="bulk-textarea" style="width:100%;min-height:280px;font-size:12px;font-family:monospace;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink)">${escapeHtml(BULK_IMPORT_TEMPLATE)}</textarea>

      </button>
      ${impAF && !impAF.loading && impAF.error === "not_found" ? `<div class="form-error">Aucune équipe trouvée pour « ${escapeHtml(p.club)} » sur API-Football.</div>` : ""}
      ${impAF && !impAF.loading && impAF.error === "no_events" ? `<div style="font-size:12px;color:var(--muted);margin-top:6px">Équipe trouvée (${escapeHtml(impAF.teamName)}), mais aucun match à venir renseigné.</div>` : ""}
      ${impAF && !impAF.loading && impAF.error === "network" ? `<div class="form-error">Relais API-Football indisponible${impAF.detail ? " : " + escapeHtml(impAF.detail) : ""}.</div>` : ""}
      ${impAF && !impAF.loading && impAF.success !== undefined ? `<div style="font-size:12px;color:var(--green);margin-top:6px">${impAF.success} match(s) importé(s) pour ${escapeHtml(impAF.teamName)}.</div>` : ""}
    </div>

    <div style="margin:6px 0 6px">
      <button class="btn btn-outline" id="import-sm-btn" style="width:100%;color:var(--green)" ${impSM && impSM.loading ? "disabled" : ""}>
        ${impSM && impSM.loading ? "Recherche sur Sportmonks…" : "Importer les prochains matchs (Sportmonks)"}
      </button>
      ${impSM && !impSM.loading && impSM.error === "not_found" ? `<div class="form-error">Aucune équipe trouvée pour « ${escapeHtml(p.club)} » sur Sportmonks.</div>` : ""}
      ${impSM && !impSM.loading && impSM.error === "no_events" ? `<div style="font-size:12px;color:var(--muted);margin-top:6px">Équipe trouvée (${escapeHtml(impSM.teamName)}), mais aucun match à venir renseigné.</div>` : ""}
      ${impSM && !impSM.loading && impSM.error === "network" ? `<div class="form-error">Relais Sportmonks indisponible${impSM.detail ? " : " + escapeHtml(impSM.detail) : ""}.</div>` : ""}
      ${impSM && !impSM.loading && impSM.success !== undefined ? `<div style="font-size:12px;color:var(--green);margin-top:6px">${impSM.success} match(s) importé(s) pour ${escapeHtml(impSM.teamName)}.</div>` : ""}
    </div>

    <div style="margin:14px 0 6px;font-size:13px;font-weight:600">Statistiques (Highlightly)</div>
    <div style="margin:0 0 6px">
      <button class="btn btn-outline" id="stats-btn" style="width:100%;color:var(--indigo)" ${stats && stats.loading ? "disabled" : ""}>
        ${stats && stats.loading ? "Recherche des statistiques…" : "Voir les statistiques"}
      </button>
      ${stats && !stats.loading && stats.error === "not_found" ? `<div class="form-error">Joueur non trouvé sur Highlightly pour « ${escapeHtml(p.prenom)} ${escapeHtml(p.nom)} ».</div>` : ""}
      ${stats && !stats.loading && stats.error === "network" ? `<div class="form-error">Relais Highlightly indisponible${stats.detail ? " : " + escapeHtml(stats.detail) : ""}.</div>` : ""}
      ${stats && !stats.loading && stats.raw ? `
        <div style="margin-top:8px">
          ${(stats.raw.perCompetition || (Array.isArray(stats.raw) ? stats.raw : [stats.raw])).map(formatStatEntry).join("")}
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">Trouvé sous le nom : ${escapeHtml(stats.playerName)} (source : Highlightly)</div>
      ` : ""}
    </div>

    <div class="form-actions">
      <button class="btn btn-primary" id="add-match-btn">+ Ajouter un match</button>
      <button class="btn btn-outline" id="edit-player-btn">Modifier</button>
    </div>
    <button class="btn btn-outline-danger" id="deactivate-btn" style="width:100%;margin-top:8px">Désactiver ce joueur</button>
  `);

  document.getElementById("import-api-btn").addEventListener("click", () => importMatchesForPlayer(p.id));
  document.getElementById("import-af-btn").addEventListener("click", () => importMatchesForPlayerViaApiFootball(p.id));
  document.getElementById("import-sm-btn").addEventListener("click", () => importMatchesForPlayerViaSportmonks(p.id));
  document.getElementById("stats-btn").addEventListener("click", () => fetchPlayerStatsFromHighlightly(p.id));
  document.getElementById("add-match-btn").addEventListener("click", () => openAddMatch(p.id));
  document.getElementById("edit-player-btn").addEventListener("click", () => openEditPlayer(p.id));
  document.getElementById("deactivate-btn").addEventListener("click", () => {
    p.actif = false; saveData(); closePanel(); render();
  });
}

function renderEditPanel(playerId) {
  const existing = playerId ? playerById(playerId) : null;
  const form = existing ? { ...existing } : {
    nom:"", prenom:"", naissance:"", nationalite:"Mali", poste:"", pied:"Droit",
    club:"", paysClub:"", categories:[], priorite:"P3", statutMali:"À surveiller"
  };

  function draw(errorMsg) {
    openOverlayPanel(`
      <div style="font-size:16px;font-weight:700;font-family:'Space Grotesk',sans-serif;margin-bottom:16px">${existing ? "Modifier le joueur" : "Ajouter un joueur"}</div>
      <div class="field-row">
        <div class="field"><label>Prénom</label><input id="f-prenom" value="${escapeHtml(form.prenom)}" /></div>
        <div class="field"><label>Nom</label><input id="f-nom" value="${escapeHtml(form.nom)}" /></div>
      </div>
      <div class="field"><label>Date de naissance</label><input type="date" id="f-naissance" value="${escapeHtml(form.naissance)}" /></div>
      <div class="field-row">
        <div class="field"><label>Poste</label><input id="f-poste" value="${escapeHtml(form.poste)}" /></div>
        <div class="field"><label>Pied fort</label>
          <select id="f-pied">
            ${["Droit","Gauche","Ambidextre"].map(o=>`<option ${form.pied===o?"selected":""}>${o}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Club</label><input id="f-club" value="${escapeHtml(form.club)}" /></div>
        <div class="field"><label>Pays du club</label><input id="f-pays" value="${escapeHtml(form.paysClub)}" /></div>
      </div>
      <div class="field"><label>Statut Mali</label>
        <select id="f-statut">
          ${["International","Éligible","À surveiller"].map(o=>`<option ${form.statutMali===o?"selected":""}>${o}</option>`).join("")}
        </select>
      </div>
      <div class="field"><label>Catégories MFC</label>
        <div id="f-categories">
          ${Object.keys(CATEGORY_STYLE).map(c => `<button type="button" class="cat-toggle ${form.categories.includes(c)?'active':''}" data-cat="${c}">${c}</button>`).join("")}
        </div>
      </div>
      <div class="field"><label>Priorité</label>
        <select id="f-priorite">
          <option value="P1" ${form.priorite==="P1"?"selected":""}>P1 — priorité maximale</option>
          <option value="P2" ${form.priorite==="P2"?"selected":""}>P2 — priorité</option>
          <option value="P3" ${form.priorite==="P3"?"selected":""}>P3 — surveillance</option>
        </select>
      </div>
      ${errorMsg ? `<div class="form-error">${errorMsg}</div>` : ""}
      <div class="form-actions">
        <button class="btn btn-primary" id="save-player-btn">Enregistrer</button>
        <button class="btn btn-outline" id="cancel-player-btn">Annuler</button>
      </div>
    `);

    document.querySelectorAll("[data-cat]").forEach(el => el.addEventListener("click", () => {
      const c = el.dataset.cat;
      form.categories = form.categories.includes(c) ? form.categories.filter(x=>x!==c) : [...form.categories, c];
      draw();
    }));
    document.getElementById("cancel-player-btn").addEventListener("click", closePanel);
    document.getElementById("save-player-btn").addEventListener("click", () => {
      form.prenom = document.getElementById("f-prenom").value;
      form.nom = document.getElementById("f-nom").value;
      form.naissance = document.getElementById("f-naissance").value;
      form.poste = document.getElementById("f-poste").value;
      form.pied = document.getElementById("f-pied").value;
      form.club = document.getElementById("f-club").value;
      form.paysClub = document.getElementById("f-pays").value;
      form.statutMali = document.getElementById("f-statut").value;
      form.priorite = document.getElementById("f-priorite").value;

      if (!form.nom.trim() || !form.prenom.trim() || !form.club.trim()) {
        draw("Nom, prénom et club sont obligatoires."); return;
      }
      if (form.categories.length === 0) {
        draw("Sélectionne au moins une catégorie MFC."); return;
      }
      if (existing) {
        Object.assign(existing, form);
      } else {
        const id = "MFC-" + String(1000 + state.players.length + 1).slice(1);
        state.players.push({ ...form, id, actif: true });
      }
      saveData();
      closePanel();
      render();
    });
  }
  draw();
}

function renderAddMatchPanel(playerId) {
  const form = { competition:"", adversaire:"", domicile:true, date: todayISO(), heure:"18:00", statut:"Programmé" };

  function draw(errorMsg) {
    openOverlayPanel(`
      <div style="font-size:16px;font-weight:700;font-family:'Space Grotesk',sans-serif;margin-bottom:16px">Ajouter un match</div>
      <div class="field"><label>Compétition</label><input id="m-competition" value="${escapeHtml(form.competition)}" /></div>
      <div class="field"><label>Adversaire</label><input id="m-adversaire" value="${escapeHtml(form.adversaire)}" /></div>
      <div class="field-row">
        <div class="field"><label>Date</label><input type="date" id="m-date" value="${form.date}" /></div>
        <div class="field"><label>Heure</label><input type="time" id="m-heure" value="${form.heure}" /></div>
      </div>
      <div class="field"><label>Domicile / extérieur</label>
        <select id="m-domicile">
          <option value="dom" ${form.domicile?"selected":""}>Domicile</option>
          <option value="ext" ${!form.domicile?"selected":""}>Extérieur</option>
        </select>
      </div>
      <div class="field"><label>Statut</label>
        <select id="m-statut">
          ${["Programmé","En cours","Terminé","Reporté","Annulé"].map(o=>`<option ${form.statut===o?"selected":""}>${o}</option>`).join("")}
        </select>
      </div>
      ${errorMsg ? `<div class="form-error">${errorMsg}</div>` : ""}
      <div class="form-actions">
        <button class="btn btn-primary" id="save-match-btn">Enregistrer</button>
        <button class="btn btn-outline" id="cancel-match-btn">Annuler</button>
      </div>
    `);
    document.getElementById("cancel-match-btn").addEventListener("click", closePanel);
    document.getElementById("save-match-btn").addEventListener("click", () => {
      form.competition = document.getElementById("m-competition").value;
      form.adversaire = document.getElementById("m-adversaire").value;
      form.date = document.getElementById("m-date").value;
      form.heure = document.getElementById("m-heure").value;
      form.domicile = document.getElementById("m-domicile").value === "dom";
      form.statut = document.getElementById("m-statut").value;
      if (!form.competition.trim() || !form.adversaire.trim()) {
        draw("Adversaire et compétition sont obligatoires."); return;
      }
      state.matches.push({ ...form, id: "M-" + Date.now(), playerId, source: "Manuel" });
      saveData();
      closePanel();
      render();
    });
  }
  draw();
}

loadData();
render();
checkNewsOnLoad();
</script>
</body>
</html>
